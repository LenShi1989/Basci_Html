<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 三角製作</title>
    <style>
      .box1 {
        width: 0;
        height: 0;
        /* border: 10px solid purple; */
        border-top: 10px solid purple;
        border-right: 10px solid red;
        border-bottom: 10px solid blue;
        border-left: 10px solid green;
      }
      .box2 {
        width: 0;
        height: 0;
        border: 50px solid transparent;
        border-right-color: purple;
        margin: 100px auto;
      }
      .jd {
        position: relative;
        width: 120px;
        height: 249px;
        background-color: purple;
        margin: 100px auto;
      }
      .jd span {
        position: absolute;
        right: 15px;
        top: -10px;
        width: 0;
        height: 0;
        /* 為了照顧兼容性 */
        line-height: 0;
        font-size: 0;
        border: 5px solid transparent;
        border-bottom-color: purple;
      }
      .mi {
        position: relative;
        width: 249px;
        height: 120px;
        background-color: purple;
        margin: 100px auto;
      }
      .mi span {
        position: absolute;
        right: -10px;
        top: 10px;
        width: 0;
        height: 0;
        /* 為了照顧兼容性 */
        line-height: 0;
        font-size: 0;
        border: 5px solid transparent;
        border-left-color: purple;
      }
    </style>
  </head>
  <body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="jd">
      <span></span>
    </div>
    <div class="mi">
      <span></span>
    </div>
  </body>
</html>
