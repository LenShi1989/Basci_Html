<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字體圖標的使用</title>
    <style>
      /* 字體聲明 */
      @font-face {
        font-family: "icomoon";
        src: url("fonts/icomoon.eot?hgy7gx");
        src:
          url("fonts/icomoon.eot?hgy7gx#iefix") format("embedded-opentype"),
          url("fonts/icomoon.ttf?hgy7gx") format("truetype"),
          url("fonts/icomoon.woff?hgy7gx") format("woff"),
          url("fonts/icomoon.svg?hgy7gx#icomoon") format("svg");
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      span {
        font-family: "icomoon";
        font-size: 100px;
        color: purple;
      }
    </style>
  </head>
  <body>
    <span></span>
    <span></span>
  </body>
</html>
