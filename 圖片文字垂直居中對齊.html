<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>利用vertical-align實現圖片文字垂直居中對齊</title>
    <style>
      img {
        /* vertical-align: bottom; */
        /* 讓圖片和文字垂直居中 */
        vertical-align: middle;
        /* vertical-align: top; */
      }
      textarea {
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <img src="/images/jay.jpg" alt="" /> jay周杰倫

    <br />
    <textarea name="" id="" cols="30" rows="10"></textarea> 請您留言
  </body>
</html>
